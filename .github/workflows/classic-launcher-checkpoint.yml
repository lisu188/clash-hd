name: Classic launcher integration checkpoint
on:
  push:
    branches: [codex/classic-menu-launcher]
    paths:
      - tools/integrate_classic_launcher.py
      - tools/classic_launcher_checkpoint.json
      - .github/workflows/classic-launcher-checkpoint.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare isolated launcher UI fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk
          python -m pip install --only-binary=:all: -r tools/requirements-framed-offline.txt
      - name: Preserve the repository LF policy for the existing test file
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('tools/integrate_classic_launcher.py');raw=p.read_bytes()
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if blob(raw)!='7182b312aa3c461622d3b8f4a8b19e8941ed5d93':raise SystemExit('Unexpected executor')
          old=b"p.write_bytes(s.replace('\\n','\\r\\n').encode())"
          if raw.count(old)!=1:raise SystemExit('Unexpected newline insertion site')
          changed=raw.replace(old,b'p.write_bytes(s.encode())')
          if blob(changed)!='aa76ffddfa7ccb1d6b3454a7f79ee3c4ff923328':raise SystemExit('Unexpected corrected executor')
          p.write_bytes(changed)
          PY
      - name: Apply exact reviewed changes and test before task-branch commit
        env:
          CLASH_LAUNCHER_UI_TESTS: '1'
        run: xvfb-run -a -s '-screen 0 2400x1800x24 -nolisten tcp' python tools/integrate_classic_launcher.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: classic-launcher-review
          path: ${{ runner.temp }}/classic-launcher-review/
          if-no-files-found: warn
          retention-days: 7
