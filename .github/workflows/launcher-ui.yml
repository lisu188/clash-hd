name: Launcher UI
on:
  pull_request:
    paths:
      - 'src/launcher/**'
      - 'tools/test_launcher_ui.py'
      - '.github/workflows/launcher-ui.yml'
  push:
    branches: [main]
    paths:
      - 'src/launcher/**'
      - 'tools/test_launcher_ui.py'
      - '.github/workflows/launcher-ui.yml'
permissions:
  contents: read
concurrency:
  group: launcher-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    name: Isolated launcher UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CLASH_LAUNCHER_UI_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk python3-pil
      - name: Exercise actual widgets and interaction guards without skipped tests
        run: |
          cat > "$RUNNER_TEMP/run_launcher_ui_tests.py" <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tools', pattern='test_launcher_ui.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
          if [ "$RUNNER_OS" = 'Linux' ]; then
            xvfb-run -a -s '-screen 0 2400x1800x24 -nolisten tcp' /usr/bin/python3 "$RUNNER_TEMP/run_launcher_ui_tests.py"
          else
            python "$RUNNER_TEMP/run_launcher_ui_tests.py"
          fi
      - name: Capture actual launcher on an isolated Linux display only
        if: runner.os == 'Linux'
        run: |
          export SCREENSHOT_ROOT="$RUNNER_TEMP/launcher-ui"
          xvfb-run -a -s '-screen 0 1800x1400x24 -nolisten tcp' /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import time
          import tkinter as tk
          from PIL import ImageGrab
          sys.path.insert(0, str(Path.cwd() / 'src/launcher'))
          import bootstrap
          bootstrap.ensure_repo_paths()
          import core
          import gui
          import settings
          output = Path(os.environ['SCREENSHOT_ROOT'])
          output.mkdir()
          records = []
          with tempfile.TemporaryDirectory(prefix='launcher-ui-capture-') as temp:
              folder = Path(temp)
              os.environ['LOCALAPPDATA'] = str(folder / 'settings')
              settings.save_settings(dict(settings.DEFAULT_SETTINGS, clash_dir=str(folder / 'game-not-installed'), candidates_root=str(folder / 'candidates')))
              root = tk.Tk()
              try:
                  root.tk.call('tk', 'scaling', 96 / 72)
                  app = gui.LauncherApp(root)
                  for renderer, resolution, tab in [('classic', '800x600', 'Main settings'), ('framed', '1280x720', 'Main settings'), ('framed', '1366x768', 'Main settings'), ('framed', '1280x720', 'Diagnostics')]:
                      app.profile_var.set(renderer)
                      app.on_profile_change()
                      app.resolution_var.set(resolution)
                      app.notebook.select(app.tabs[tab])
                      root.update()
                      time.sleep(0.1)
                      x, y, w, h = root.winfo_rootx(), root.winfo_rooty(), root.winfo_width(), root.winfo_height()
                      first = ImageGrab.grab(bbox=(x, y, x+w, y+h), xdisplay=os.environ['DISPLAY'])
                      time.sleep(0.1)
                      root.update()
                      second = ImageGrab.grab(bbox=(x, y, x+w, y+h), xdisplay=os.environ['DISPLAY'])
                      assert first.tobytes() == second.tobytes(), 'Unstable launcher capture'
                      name = f"launcher-{renderer}-{resolution}-{tab.lower().replace(' ', '-')}.png"
                      first.save(output / name)
                      records.append({'file': name, 'renderer': renderer, 'resolution': resolution, 'tab': tab, 'size': [w, h], 'stable_pair': True, 'sha256': hashlib.sha256((output / name).read_bytes()).hexdigest()})
              finally:
                  root.destroy()
              assert not (folder / 'candidates').exists()
              assert not (folder / 'game-not-installed').exists()
          report = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'gui_sha256': hashlib.sha256(Path('src/launcher/gui.py').read_bytes()).hexdigest(), 'capture_method': 'actual Tk widgets on isolated Linux Xvfb at 96 DPI', 'game_installed': False, 'candidate_built': False, 'game_runtime_executed': False, 'manual_input_proof': False, 'screenshots': records}
          (output / 'screenshot-manifest.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: launcher-ui-screenshots
          path: ${{ runner.temp }}/launcher-ui/
          retention-days: 7
          if-no-files-found: error
