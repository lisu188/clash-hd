name: Modal widget bounds CPU fixtures

on:
  pull_request:
    paths:
      - 'src/patcher/framed_modal_widget_bounds.py'
      - 'src/patcher/.gitattributes'
      - 'tools/test_modal_widget_bounds.py'
      - 'tools/.gitattributes'
      - '.github/workflows/modal-widget-bounds.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/framed_modal_widget_bounds.py'
      - 'tools/test_modal_widget_bounds.py'
      - '.github/workflows/modal-widget-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-widget-bounds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require native CPU coverage without skipped tests
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, sys, unittest
          from pathlib import Path
          sys.path[:0] = [str(Path.cwd()), str(Path.cwd() / 'tools')]
          from run_framed_offline_tests import source_preflight
          preflight = source_preflight(Path.cwd())
          if not preflight['passed']:
              raise SystemExit('Frozen source preflight failed')
          suite = unittest.defaultTestLoader.loadTestsFromName('test_modal_widget_bounds')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sources = ['src/patcher/framed_modal_widget_bounds.py', 'tools/test_modal_widget_bounds.py']
          report = dict(schema=1, source_preflight=preflight, platform=platform.platform(),
                        tested_sha=os.environ['GITHUB_SHA'], tests_run=result.testsRun,
                        errors=[(str(t), text) for t, text in result.errors],
                        failures=[(str(t), text) for t, text in result.failures], skipped=result.skipped,
                        passed=result.wasSuccessful() and not result.skipped and result.testsRun == 6,
                        source_hashes={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sources},
                        proof_class='synthetic_native_i386_widget_guard_only', owner_validator='labeled synthetic stub',
                        game_runtime_executed=False, installation_ready=False, manual_input_proof=False, promotion_ready=False)
          Path(os.environ['RUNNER_TEMP'], 'widget-cpu.json').write_text(json.dumps(report, indent=2))
          raise SystemExit(0 if report['passed'] else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: widget-cpu-${{ matrix.os }}
          path: ${{ runner.temp }}/widget-cpu.json
          if-no-files-found: error
          retention-days: 7
