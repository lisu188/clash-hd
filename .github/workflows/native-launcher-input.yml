name: Native launcher input checkpoint
on:
  push:
    branches: [codex/native-launcher-input]
  workflow_dispatch:
    inputs:
      execute:
        description: 'Exercise a campaign-menu click on isolated real game processes'
        type: boolean
        required: true
        default: false
      approval_text:
        description: 'Actual approval for native input and owned game-window capture'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-launcher-input-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r tools/requirements-framed-offline.txt
          python -m unittest discover -s tools -p test_native_launcher_input.py -v
          python -m unittest discover -s tools -p test_runner_menu_input.py -v
  runtime:
    if: github.repository == 'lisu188/clash-hd' && (github.event_name == 'push' || inputs.execute)
    needs: source
    strategy:
      fail-fast: false
      matrix:
        profile: [classic,modalwidgets]
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RUN_ROOT: C:/ClashTests/input-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      PROXY_ROOT: C:/ClashTests/input-proxy
      APPROVAL_TEXT: ${{ inputs.approval_text || 'Kontynuuj aż wszystkie rozdzielczości wspierane przez launcher będą działać (current user request, 2026-09-20)' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lisu188/clash-assets
          ref: 84a1e4bcf131e6bb75b39fc5e10941dd0b801767
          path: assets
          persist-credentials: false
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Materialize full immutable reference runtime
        shell: bash
        working-directory: assets
        run: git lfs pull --include='runtime/gog-32003/**' --exclude=''
      - name: Compile the source-bound corrected DirectDraw proxy
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r code/tools/requirements-framed-offline.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          & ./code/scripts/build/build_ddraw_surfdump_proxy.ps1 -OutputDll "$env:PROXY_ROOT/ddraw.dll" -LogDir "$env:PROXY_ROOT"
      - name: Observe native input with an explicit temporary runner foreground attachment
        shell: pwsh
        run: |
          python code/tools/native_launcher_input.py --execute --allow-native-input --runner-focus --approval-text "$env:APPROVAL_TEXT" --profile '${{ matrix.profile }}' --resolution 1024x768 --steps campaign:224,185 --runtime assets/runtime/gog-32003 --manifest assets/sources/gog-32003/manifest.json --proxy "$env:PROXY_ROOT/ddraw.dll" --out "$env:RUN_ROOT"
          exit $LASTEXITCODE
      - name: Retain exact input source identity
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUN_ROOT/source" | Out-Null
          Copy-Item code/tools/native_launcher_input.py "$env:RUN_ROOT/source/"
          Copy-Item code/tools/launcher_resolution_matrix.py "$env:RUN_ROOT/source/"
          Copy-Item code/tools/menu_pulse_click.py "$env:RUN_ROOT/source/"
          Copy-Item code/tools/runner_menu_input.py "$env:RUN_ROOT/source/"
          Copy-Item "$env:PROXY_ROOT/ddraw_surfdump_proxy.build.json" "$env:RUN_ROOT/source/" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-input-${{ matrix.profile }}-1024x768
          path: |
            ${{ env.RUN_ROOT }}/input-report.json
            ${{ env.RUN_ROOT }}/input.json
            ${{ env.RUN_ROOT }}/input.focus.json
            ${{ env.RUN_ROOT }}/input.log
            ${{ env.RUN_ROOT }}/compile.log
            ${{ env.RUN_ROOT }}/real-exe-engine.cpp
            ${{ env.RUN_ROOT }}/capture/
            ${{ env.RUN_ROOT }}/source/
          if-no-files-found: warn
          retention-days: 7
