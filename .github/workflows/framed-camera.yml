name: Framed camera patcher
on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/build_framed*'
      - 'tools/test_framed_camera.py'
      - '.github/workflows/framed-camera.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/build_framed*'
      - 'tools/test_framed_camera.py'
      - '.github/workflows/framed-camera.yml'
permissions:
  contents: read
concurrency:
  group: framed-camera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Camera byte and native x86 tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute camera contracts and real 32-bit fixture instructions
        run: |
          python - <<'PY'
          import unittest
          import sys
          suite = unittest.defaultTestLoader.discover('tools', pattern='test_framed_camera.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and result.testsRun >= 18 and not result.skipped else 1)
          PY
      - name: Existing scalar and framed geometry regressions
        run: |
          python tools/test_patch_resolution.py
          python tools/test_framed_recipe.py
          python tools/test_framed_viewport.py
          python tools/test_display_plan.py
