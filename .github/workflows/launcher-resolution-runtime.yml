name: Full launcher resolution runtime
on:
  push:
    branches: [codex/launcher-resolution-matrix]
  pull_request:
    paths: ['tools/launcher_resolution_matrix.py', 'tools/resolution_playability.py', 'tools/test_resolution_playability.py', 'tools/test_launcher_resolution_matrix.py', '.github/workflows/launcher-resolution-runtime.yml']
  workflow_dispatch:
    inputs:
      execute:
        description: 'Run isolated real EXE menu, campaign and map-control checks'
        type: boolean
        required: true
        default: false
      approval_text:
        description: 'Actual approval for native input and owned game captures'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: resolution-playability-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r tools/requirements-framed-offline.txt
          python -m unittest discover -s tools -p test_launcher_resolution_matrix.py -v
          python -m unittest discover -s tools -p test_resolution_playability.py -v
          python tools/test_real_exe_smoke.py
  runtime:
    if: github.repository == 'lisu188/clash-hd' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execute))
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: modalwidgets
            resolution: 1024x768
          - profile: framed
            resolution: 3840x2160
          - profile: classic
            resolution: 3840x2160
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RUN_ROOT: C:/ClashTests/playability-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}-${{ matrix.resolution }}
      PROXY_ROOT: C:/ClashTests/playability-proxy
      APPROVAL_TEXT: ${{ inputs.approval_text || 'Kontynuuj aż wszystkie rozdzielczości wspierane przez launcher będą działać — current task, isolated runner, 2026-09-21' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lisu188/clash-assets
          ref: 84a1e4bcf131e6bb75b39fc5e10941dd0b801767
          path: assets
          persist-credentials: false
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Materialize exact original game files
        shell: bash
        working-directory: assets
        run: git lfs pull --include='runtime/gog-32003/**' --exclude=''
      - name: Build the corrected source-bound presentation proxy
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r code/tools/requirements-framed-offline.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          & ./code/scripts/build/build_ddraw_surfdump_proxy.ps1 -OutputDll "$env:PROXY_ROOT/ddraw.dll" -LogDir "$env:PROXY_ROOT"
      - name: Verify source boundaries on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s code/tools -p test_resolution_playability.py -v
          exit $LASTEXITCODE
      - name: Verify menu pixels, enter campaign, dismiss briefing and exercise map input
        shell: pwsh
        run: |
          python code/tools/resolution_playability.py --execute --approval-text "$env:APPROVAL_TEXT" --profile '${{ matrix.profile }}' --resolution '${{ matrix.resolution }}' --runtime assets/runtime/gog-32003 --manifest assets/sources/gog-32003/manifest.json --proxy "$env:PROXY_ROOT/ddraw.dll" --out "$env:RUN_ROOT"
          exit $LASTEXITCODE
      - name: Retain producer sources and proxy identity without binaries
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUN_ROOT/source" | Out-Null
          Copy-Item code/tools/resolution_playability.py,code/tools/launcher_resolution_matrix.py,code/tools/real_exe_smoke.py,code/tools/runner_menu_input.py,code/tools/menu_pulse_click.py "$env:RUN_ROOT/source/"
          Copy-Item code/src/launcher/resolutions.json "$env:RUN_ROOT/source/"
          Copy-Item "$env:PROXY_ROOT/ddraw_surfdump_proxy.build.json" "$env:RUN_ROOT/source/" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playability-${{ matrix.profile }}-${{ matrix.resolution }}
          path: |
            ${{ env.RUN_ROOT }}/*.json
            ${{ env.RUN_ROOT }}/*.log
            ${{ env.RUN_ROOT }}/real-exe-engine.cpp
            ${{ env.RUN_ROOT }}/capture/
            ${{ env.RUN_ROOT }}/source/
          if-no-files-found: warn
          retention-days: 7
