name: Full launcher resolution runtime
on:
  push:
    branches: [codex/launcher-resolution-matrix]
  pull_request:
    paths: ['tools/launcher_resolution_matrix.py', 'tools/test_launcher_resolution_matrix.py', '.github/workflows/launcher-resolution-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r tools/requirements-framed-offline.txt
          python -m unittest discover -s tools -p test_launcher_resolution_matrix.py -v
      - name: Export immutable tracked source for local review
        if: always()
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/clash-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resolution-review-source
          path: |
            ${{ runner.temp }}/clash-source.zip
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-tree.txt
          retention-days: 7
