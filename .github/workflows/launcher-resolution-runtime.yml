name: Full launcher resolution runtime
on:
  push:
    branches: [codex/launcher-resolution-matrix]
  pull_request:
    paths:
      - tools/launcher_resolution_matrix.py
      - tools/test_launcher_resolution_matrix.py
      - .github/workflows/launcher-resolution-runtime.yml
  workflow_dispatch:
    inputs:
      execute:
        description: 'Run every advertised launcher preset on isolated Windows runners'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: launcher-resolution-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r tools/requirements-framed-offline.txt
      - name: Check inventory, identity, display selection and incomplete-result reporting
        run: python -m unittest discover -s tools -p test_launcher_resolution_matrix.py -v
      - id: inventory
        name: Derive every profile and resolution from the real launcher manifest
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'tools'))
          import launcher_resolution_matrix as matrix
          cases=matrix.inventory()
          resolutions=list(dict.fromkeys(row['resolution'] for row in cases))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('matrix='+json.dumps({'include':[{'resolution':r} for r in resolutions]},separators=(',',':'))+'\n')
          print(json.dumps(cases,indent=2))
          PY
  runtime:
    if: github.repository == 'lisu188/clash-hd' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execute))
    needs: source
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RESOLUTION: ${{ matrix.resolution }}
      RUN_ROOT: C:/ClashTests/resolution-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.resolution }}
      PROXY_ROOT: C:/ClashTests/matrix-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lisu188/clash-assets
          ref: 84a1e4bcf131e6bb75b39fc5e10941dd0b801767
          path: assets
          persist-credentials: false
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Materialize one shared reference runtime per resolution
        shell: bash
        working-directory: assets
        run: git lfs pull --include='runtime/gog-32003/**' --exclude=''
      - name: Compile corrected source-bound presentation proxy
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r code/tools/requirements-framed-offline.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          & ./code/scripts/build/build_ddraw_surfdump_proxy.ps1 -OutputDll "$env:PROXY_ROOT/ddraw.dll" -LogDir "$env:PROXY_ROOT"
      - name: Test source boundaries on Windows without executing games
        shell: pwsh
        run: |
          python -m unittest discover -s code/tools -p test_launcher_resolution_matrix.py -v
          exit $LASTEXITCODE
      - name: Execute every launcher profile advertising this resolution
        shell: bash
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path('code').resolve();sys.path.insert(0,str(root/'tools'))
          import launcher_resolution_matrix as matrix
          run=Path(os.environ['RUN_ROOT']);run.mkdir(parents=True,exist_ok=False)
          cases=[r for r in matrix.inventory() if r['resolution']==os.environ['RESOLUTION']]
          outcomes=[]
          for case in cases:
              profile=case['profile'];out=run/profile
              command=[sys.executable,str(root/'tools/launcher_resolution_matrix.py'),
                       '--execute','--profile',profile,'--resolution',case['resolution'],
                       '--runtime',str(Path('assets/runtime/gog-32003').resolve()),
                       '--manifest',str(Path('assets/sources/gog-32003/manifest.json').resolve()),
                       '--proxy',str(Path(os.environ['PROXY_ROOT'])/'ddraw.dll'),'--out',str(out),'--seconds','40']
              with (run/(profile+'.log')).open('w',encoding='utf-8') as log:
                  try: status=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=1200).returncode
                  except subprocess.TimeoutExpired: status=124
              outcomes.append(dict(case,exit_code=status))
              print(json.dumps(outcomes[-1]),flush=True)
          (run/'resolution.json').write_text(json.dumps(outcomes,indent=2))
          raise SystemExit(int(any(r['exit_code']!=0 for r in outcomes)))
          PY
      - name: Retain exact harness source, not executable or asset copies
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUN_ROOT/source" | Out-Null
          Copy-Item code/tools/launcher_resolution_matrix.py "$env:RUN_ROOT/source/launcher_resolution_matrix.py"
          Copy-Item code/tools/real_exe_smoke.py "$env:RUN_ROOT/source/real_exe_smoke.py"
          Copy-Item code/src/launcher/resolutions.json "$env:RUN_ROOT/source/resolutions.json"
          Copy-Item "$env:PROXY_ROOT/ddraw_surfdump_proxy.build.json" "$env:RUN_ROOT/source/proxy-build.json" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resolution-${{ matrix.resolution }}
          path: |
            ${{ env.RUN_ROOT }}/*.json
            ${{ env.RUN_ROOT }}/*.log
            ${{ env.RUN_ROOT }}/*/report.json
            ${{ env.RUN_ROOT }}/*/compile.log
            ${{ env.RUN_ROOT }}/*/real-exe-engine.cpp
            ${{ env.RUN_ROOT }}/*/capture/
            ${{ env.RUN_ROOT }}/source/
          if-no-files-found: error
          retention-days: 7
  summary:
    if: always() && needs.runtime.result != 'skipped'
    needs: [source,runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: resolution-*
          path: ${{ runner.temp }}/resolution-results
      - name: Retain complete receipt index, including every failure and missing case
        shell: bash
        run: |
          python tools/launcher_resolution_matrix.py --summarize "$RUNNER_TEMP/resolution-results" > "$RUNNER_TEMP/launcher-matrix-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launcher-matrix-summary
          path: ${{ runner.temp }}/launcher-matrix-summary.json
          if-no-files-found: error
          retention-days: 7
