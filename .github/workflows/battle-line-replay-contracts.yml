name: Battle line replay source contracts

on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-line-replay-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-line-replay-contracts.yml'

permissions:
  contents: read

concurrency:
  group: battle-line-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Uninstalled line replay and modeled pixels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Check the final line source across all profiles and presets without skips
        run: python -B tools/test_battle_profile_line_replay.py --require-machine-tools
      - name: Record evidence limits
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('Two direct memory-line calls are prepared in an uninstalled successor. Whole native call/cleanup windows, both call PCs, duplicate RET8 arguments, outputs and zero-loss admission are source-bound.\n\n')
              output.write('All 36 profile/preset geometries are checked at two modeled image bases. Pixel writes and normal return are synthetic models; original native opcodes are not executed by these fixtures.\n\n')
              output.write('All installed-hook lists remain empty. RLE/provider ownership, complete battle integration, native rendering, healthy map return, input, endurance, release and promotion remain unproved.\n')
          PY
