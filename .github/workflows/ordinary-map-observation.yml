name: Ordinary map paused observation

on:
  pull_request:
    paths:
      # The synthetic engine imports the shared PE/probe fixture chain.
      - 'tools/**'
      - 'src/patcher/**'
      - 'docs/hd/ORDINARY_MAP*.md'
      - '.github/workflows/ordinary-map-observation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'src/patcher/**'
      - 'docs/hd/ORDINARY_MAP*.md'
      - '.github/workflows/ordinary-map-observation.yml'

permissions:
  contents: read

concurrency:
  group: ordinary-map-observation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Portable observation and mocked input (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned array and image fixture dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/requirements-framed-offline.txt
      - name: Check paused observations, planning and mocked delivery
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/test_ordinary_map_input_plan.py -v
          python -B tools/test_ordinary_map_observation.py -v
          python -B tools/test_ordinary_map_pause_host.py -v
          python -B tools/test_ordinary_map_pause_client.py -v
          python -B tools/test_ordinary_map_pause_engine.py ReportTests -v
          python -B tools/test_ordinary_map_observation_session.py -v
          python -B tools/test_menu_pulse_delivery.py -v
          python -B tools/test_runner_cursor_feedback.py -v

  engine:
    name: Owned pause lease on a synthetic x86 process
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CLASH_PAUSE_ENGINE_INTEGRATION: '1'
      _NT_SYMBOL_PATH: '.'
      _NT_ALT_SYMBOL_PATH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned shared fixture dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/requirements-framed-offline.txt
      - name: Verify the system Microsoft x86 debugger engine
        shell: pwsh
        run: |
          $engine = Join-Path $env:WINDIR 'SysWOW64\dbgeng.dll'
          if (-not (Test-Path -LiteralPath $engine)) { throw 'System x86 debugger engine is required.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $engine
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'System debugger engine signature did not verify as Microsoft.'
          }
          Get-Item -LiteralPath $engine | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}}
          Get-FileHash -LiteralPath $engine -Algorithm SHA256
      - name: Require both real debugger lease fixtures without skips
        shell: pwsh
        run: |
          $env:CLASH_PAUSE_ENGINE_REPORT = Join-Path $env:RUNNER_TEMP 'ordinary-map-pause-engine-report.json'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x86 tools are required.' }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $entry = Join-Path $env:RUNNER_TEMP 'run-pause-engine-tests.py'
          @'
          import json
          import os
          from pathlib import Path
          import sys
          import unittest

          sys.path.insert(0, str(Path('tools').resolve()))
          suite = unittest.defaultTestLoader.loadTestsFromName('test_ordinary_map_pause_engine.PauseEngineTests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = json.loads(Path(os.environ['CLASH_PAUSE_ENGINE_REPORT']).read_text(encoding='utf-8'))
          report_ok = (
              report['schema'] == 'clash95_pause_engine_fixture_v1'
              and report['expected_cases'] == 2
              and report['completed'] is True
              and report['passed'] is True
              and report['game_runtime_executed'] is False
              and report['fixture_runtime_executed'] is True
              and report['manual_input_proof'] is False
              and len(report['cases']) == 2
              and {row['case'] for row in report['cases']} == {'pause-resume-counter', 'expired-lease'}
              and all(row['passed'] is True for row in report['cases'])
          )
          sys.exit(0 if result.wasSuccessful() and result.testsRun == 2 and not result.skipped and report_ok else 1)
          '@ | Set-Content -Encoding utf8 $entry
          $batch = Join-Path $env:RUNNER_TEMP 'run-pause-engine-tests.cmd'
          @"
          @echo off
          call "$devcmd" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          python -B "$entry"
          exit /b %errorlevel%
          "@ | Set-Content -Encoding ascii $batch
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic debugger pause-lease fixtures failed or were skipped.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ordinary-map-pause-engine-report
          path: ${{ runner.temp }}/ordinary-map-pause-engine-report.json
          retention-days: 7
          if-no-files-found: error
