name: Real Clash EXE smoke

on:
  push:
    branches: [codex/real-exe-smoke]
    paths: ['tools/real_exe_smoke.py', '.github/workflows/real-exe-smoke.yml']
  workflow_dispatch:
    inputs:
      execute:
        description: 'Explicitly launch original game copies on the disposable Windows runner'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: real-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original:
    if: github.repository == 'lisu188/clash-hd' && (github.event_name == 'push' || inputs.execute)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lisu188/clash-assets
          ref: 84a1e4bcf131e6bb75b39fc5e10941dd0b801767
          path: assets
          persist-credentials: false
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Materialize full original runtime
        shell: bash
        working-directory: assets
        run: git lfs pull --include='runtime/gog-32003/**' --exclude=''
      - name: Prepare diagnostic proxy and image conversion
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r code/tools/requirements-framed-offline.txt
          if ($LASTEXITCODE -ne 0) { throw 'Fixture dependencies failed' }
          & ./code/scripts/build/build_ddraw_surfdump_proxy.ps1 -OutputDll "C:/ClashTests/clash-proxy/ddraw.dll" -LogDir "C:/ClashTests/clash-proxy"
      - name: Check opt-in and failure reporting
        shell: pwsh
        run: |
          python code/tools/test_real_exe_smoke.py
          exit $LASTEXITCODE
      - name: Launch actual original EXE and retain observed state
        shell: pwsh
        run: |
          python code/tools/real_exe_smoke.py --execute --runtime assets/runtime/gog-32003 --manifest assets/sources/gog-32003/manifest.json --out "C:/ClashTests/real-exe" --proxy "C:/ClashTests/clash-proxy/ddraw.dll" --seconds 60 --complete-hd
          exit $LASTEXITCODE
      - name: Retain logs and actual process captures, never game binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-exe-smoke
          path: |
            C:/ClashTests/real-exe/summary.json
            C:/ClashTests/real-exe/compile.log
            C:/ClashTests/real-exe/real-exe-engine.cpp
            C:/ClashTests/real-exe/gog/
            C:/ClashTests/real-exe/proxy/
            C:/ClashTests/real-exe/completehd-proxy/
            C:/ClashTests/real-exe/bundle/*.candidate.json
            C:/ClashTests/clash-proxy/ddraw_surfdump_proxy.build.json
            C:/ClashTests/clash-proxy/ddraw-proxy-build/build.log
          retention-days: 7
          if-no-files-found: warn
