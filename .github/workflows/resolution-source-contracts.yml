name: Resolution successor source contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolution-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Successor source and synthetic CPU (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Verify all-preset constructor source and synthetic PE contracts
        run: python -B tools/test_complete_hd_all_presets_candidate.py
      - name: Verify Classic's actual narrow and wide predecessors
        run: python -B tools/test_classic_all_presets_candidate.py
      - name: Verify independent Framed reconstruction and ownership
        run: python -B tools/test_framed_all_presets_candidate.py
      - name: Verify all-preset Modal Widgets reconstruction contracts
        run: python -B tools/test_modal_widgets_all_presets_candidate.py
      - name: Reject mismatched successor recipe authentication
        run: python -B tools/test_resolution_release_matrix.py
      - name: Execute saved-camera adapters on synthetic x86 state
        run: python -B tools/test_framed_battle_saved_views.py --require-machine-tools
      - name: Reject incomplete and substituted raw soak diagnostics
        run: python -B tools/test_complete_hd_evidence.py
      - name: Summarize evidence boundaries
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('## Resolution successor source contracts\n\n')
              output.write('All four preset constructors use synthetic PE fixtures here. Their optional original-backed lanes are separate local evidence.\n\n')
              output.write('Successor recipe authentication does not register a launcher recipe or establish runtime acceptance.\n\n')
              output.write('Saved-camera machine checks require Unicorn and execute synthetic x86 state. The original-byte case explicitly skips because proprietary originals are unavailable in CI.\n\n')
              output.write('The raw soak helper always keeps release acceptance false. Fourteen production lane verifiers and installed expanded battles remain outstanding.\n\n')
              output.write('No game, native debugger, compiler, capture, manual input or stable promotion occurs in this job.\n')
          PY
