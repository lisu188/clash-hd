name: Tactical field source contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-field-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Owned field and modeled native tiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Execute guarded fields and coordinate boundaries
        run: |
          set -euo pipefail
          python -B tools/test_battle_profile_field.py --require-machine-tools
          python -B tools/test_battle_profile_field_v2.py --require-machine-tools
      - name: Summarize evidence boundaries
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('## Tactical field source contracts\n\n')
              output.write('The native tile call is modeled in synthetic x86 memory. Test pixels are deterministic patterns, not game frames or screenshots.\n\n')
              output.write('The versioned successor shares frame-relative receipt helpers and compares pixels, queries, callback order and the outer ABI against the frozen predecessor at all 36 geometries and two image bases.\n\n')
              output.write('The field component remains uninstalled. Passing checks establish no native rendering, expanded-battle candidate, runtime input, composition, endurance, healthy map return or promotion.\n\n')
              output.write('No proprietary original, game, debugger, renderer, compiler, capture or input driver runs in this job.\n')
          PY

  content:
    name: Battle body content and bounded arrays (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Check fixed body operands, bounds and status ABI
        run: python -B tools/test_battle_profile_content.py --require-machine-tools
      - name: Summarize evidence boundaries
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('## Uninstalled battle content reads\n\n')
              output.write('Fixed body CALLs, original array values and native frame ancestry are modeled in synthetic x86 memory at all 36 geometries and two image bases.\n\n')
              output.write('The value/status ABI requires future fault-aware adapters and original subregister destinations. No native instruction replay, hooks, Count-entry safety, provider/cancellation, arena clipping, expanded-battle acceptance, runtime or promotion is established.\n\n')
              output.write('No proprietary original, game, debugger, renderer, compiler, capture or input driver runs in this job.\n')
          PY

  continuation:
    name: Prepared native operand and continuation contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Check source-owned native operands and continuation without skips
        run: python -B tools/test_battle_profile_continuation.py --require-machine-tools
      - name: Summarize evidence boundaries
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('## Uninstalled native continuation preparation\n\n')
              output.write('Original operand, Count-entry and post-return paths are modeled at all 36 geometries and two bases in synthetic x86 memory. No game instructions execute natively.\n\n')
              output.write('All hooks remain absent. Unknown-control cancellation, provider/RLE, receiver/arguments, physical clipping, full integration and healthy native restoration remain unfinished.\n\n')
              output.write('Passing source checks cannot establish expanded-battle candidates, runtime, input, composition, endurance, release or promotion. No proprietary original, game, debugger, compiler, renderer, capture or input driver runs in this job.\n')
          PY

  stack-lease:
    name: Owned stack lease and modeled native returns (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Check owning stack and normal native return receipts
        run: python -B tools/test_battle_profile_stack_lease.py --require-machine-tools
      - name: Summarize evidence boundaries
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('## Uninstalled battle stack lease\n\n')
              output.write('Native return and callback behavior is modeled in synthetic x86 memory at all 36 geometries and two image bases. Buffers are deterministic test patterns, not game screenshots.\n\n')
              output.write('No hooks, immediate continuation cancellation, primitive argument/receiver safety, physical clipping, native runtime, healthy restoration or promotion are established.\n\n')
              output.write('No proprietary original, game, debugger, renderer, compiler, capture or input driver runs in this job.\n')
          PY
