name: Original game runtime diagnostic

on:
  push:
    branches: [codex/original-game-launch]
  workflow_dispatch:
    inputs:
      approval_text:
        description: 'Explicit approval for isolated real-game execution and game-window capture'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: original-game-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original:
    if: github.repository == 'lisu188/clash-hd'
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      RUN_ROOT: C:/ClashTests/original-game-${{ github.run_id }}-${{ github.run_attempt }}
      APPROVAL_TEXT: ${{ inputs.approval_text || 'Spróbuj odpalić rzeczywiste exe; Kontynuuj pracę nad uruchomieniem rzeczywistej gry (user request, 2026-09-20)' }}
    defaults:
      run:
        shell: pwsh
        working-directory: code
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check nonexecuting input and approval boundaries
        run: python -m unittest discover -s tools -p test_original_game_smoke.py -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lisu188/clash-assets
          ref: 84a1e4bcf131e6bb75b39fc5e10941dd0b801767
          path: assets
          persist-credentials: false
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Download the full original runtime including GOG wrapper and movies
        working-directory: assets
        run: git lfs pull --include='runtime/gog-32003/**' --exclude=''
      - name: Install screenshot encoder
        run: python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Launch the real original entry point and retain game-window captures
        run: |
          python tools/run_original_game_smoke.py --assets ../assets/runtime/gog-32003 --manifest ../assets/sources/gog-32003/manifest.json --output "$env:RUN_ROOT" --execute --approval-text "$env:APPROVAL_TEXT"
      - name: Retain runner diagnostics without claiming gameplay acceptance
        if: always()
        run: |
          $evidence = Join-Path $env:RUN_ROOT 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,CurrentHorizontalResolution,CurrentVerticalResolution,CurrentBitsPerPixel | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $evidence 'display.json')
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue | Where-Object {$_.Message -match 'clash95|ddraw.dll'} | Select-Object TimeCreated,Id,ProviderName,Message | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $evidence 'application-events.json')
          if (Test-Path (Join-Path $evidence 'original-game-launch.json')) { Get-Content (Join-Path $evidence 'original-game-launch.json') -Raw }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-game-runtime
          path: ${{ env.RUN_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 7
