name: Original game runtime diagnostic

on:
  pull_request:
    paths:
      - 'tools/run_original_game_smoke.py'
      - 'tools/test_original_game_smoke.py'
      - '.github/workflows/original-game-launch.yml'
  workflow_dispatch:
    inputs:
      approval_text:
        description: 'Explicit approval for isolated real-game execution and game-window capture'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: original-game-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require all nonexecuting input and approval tests
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, unittest
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          suite = unittest.defaultTestLoader.loadTestsFromName('test_original_game_smoke')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sources = ('tools/run_original_game_smoke.py', 'tools/test_original_game_smoke.py')
          passed = result.wasSuccessful() and result.testsRun == 8 and not result.skipped
          report = dict(schema=1, passed=passed, tests_run=result.testsRun, skipped=result.skipped,
                        failures=[(str(test), text) for test, text in result.failures],
                        errors=[(str(test), text) for test, text in result.errors],
                        source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        source_hashes={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sources},
                        game_runtime_executed=False, live_capture_executed=False)
          Path(os.environ['RUNNER_TEMP'], 'original-smoke-offline.json').write_text(json.dumps(report, indent=2))
          raise SystemExit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-smoke-offline-${{ matrix.os }}
          path: ${{ runner.temp }}/original-smoke-offline.json
          if-no-files-found: error
          retention-days: 7

  original:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'lisu188/clash-hd'
    needs: offline
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      RUN_ROOT: C:/ClashTests/original-game-${{ github.run_id }}-${{ github.run_attempt }}
      APPROVAL_TEXT: ${{ inputs.approval_text }}
    defaults:
      run:
        shell: pwsh
        working-directory: code
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require supplied approval before downloading or launching the game
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APPROVAL_TEXT)) { throw 'Explicit approval text is required.' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lisu188/clash-assets
          ref: 84a1e4bcf131e6bb75b39fc5e10941dd0b801767
          path: assets
          persist-credentials: false
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Download the full original runtime including GOG wrapper and movies
        working-directory: assets
        run: git lfs pull --include='runtime/gog-32003/**' --exclude=''
      - name: Install screenshot encoder
        run: |
          python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Launch the real original entry point and wait through the intro
        run: |
          python tools/run_original_game_smoke.py --assets ../assets/runtime/gog-32003 --manifest ../assets/sources/gog-32003/manifest.json --output "$env:RUN_ROOT" --execute --approval-text "$env:APPROVAL_TEXT" --seconds 180
      - name: Retain runner diagnostics without claiming gameplay acceptance
        if: always()
        run: |
          $evidence = Join-Path $env:RUN_ROOT 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,CurrentHorizontalResolution,CurrentVerticalResolution,CurrentBitsPerPixel | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $evidence 'display.json')
          $events = @(Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue | Where-Object {$_.Message -match 'clash95|ddraw.dll'} | Select-Object TimeCreated,Id,ProviderName,Message)
          ConvertTo-Json -InputObject $events -Depth 5 | Set-Content (Join-Path $evidence 'application-events.json')
          if (Test-Path (Join-Path $evidence 'original-game-launch.json')) { Get-Content (Join-Path $evidence 'original-game-launch.json') -Raw }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-game-runtime
          path: ${{ env.RUN_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 7
