name: Fresh battle lifecycle source contracts

on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-lifecycle-v2-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-lifecycle-v2-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-lifecycle-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Fresh lifecycle and modeled callbacks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Require all sixteen source and synthetic CPU methods without skips
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          sys.path.insert(0, str(Path('tools').resolve()))
          import test_battle_profile_lifecycle_v2 as fixture
          fixture.prior_fixture.machine_tools()
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.loadTestsFromTestCase(cls)
                                     for cls in (fixture.SourceTests, fixture.CPUTests))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print('uninstalled=True native_callbacks=modeled provider_capacity_verified=False runtime_executed=False')
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 16 and not result.skipped else 1)
          PY
      - name: Record evidence limits
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('The versioned lifecycle re-emits the frozen template at fresh RX/RW addresses. Complete operands, native transfer targets and planned whole-byte hooks are checked; no hook, section or candidate is installed.\n\n')
              output.write('All 36 profile/preset geometries run at two synthetic image bases. Allocation, construction, destruction and thread callbacks are explicit models. The original-backed RAM lane is not run in public CI.\n\n')
              output.write('The new RW tail/provider reservation must remain zero. Nonzero inherited modal tail is unsupported by this restrictive admission; native dynamic writers and lifetime compatibility are unproved.\n\n')
              output.write('The 456-byte component stack bound does not establish complete-chain capacity. Provider schema/lifetime, RLE cancellation, drawing/input/camera/animation/dialog/results, quit, atomic installation, healthy map return and runtime acceptance remain unfinished.\n\n')
              output.write('No game, native debugger/compiler, live capture, manual input, endurance, release acceptance or stable promotion occurs in this job.\n')
          PY
