name: Fresh battle content source contracts

on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-content-v2-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-content-v2-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-content-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Fresh content and modeled native body reads (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Require all seventeen source and synthetic CPU methods without skips
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import json
          import sys
          import unittest
          sys.path.insert(0, str(Path('tools').resolve()))
          import test_battle_profile_content_v2 as fixture
          fixture.verify_frozen()
          if fixture.parent_fixture.field_fixture.routing_fixture.lifetime.prior_fixture.machine_tools() is None:
              raise ImportError('required Unicorn model tools unavailable')
          before = fixture.source_closure()
          print('source_closure_before ' + json.dumps(before, sort_keys=True), flush=True)
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.loadTestsFromTestCase(cls) for cls in
                                     (fixture.PrototypeSourceTests, fixture.SourceTests, fixture.CPUTests))
          result = unittest.TextTestRunner(verbosity=2, resultclass=fixture.TimedResult).run(suite)
          after = fixture.source_closure()
          print('source_closure_after ' + json.dumps(after, sort_keys=True), flush=True)
          if before != after:
              raise ValueError('Content source closure changed during fixture run')
          print('content_model_stack ' + json.dumps(dict(
              observations=fixture.Machine.content_stack_observations,
              maximum_native_site_sp_to_low_point_bytes=fixture.Machine.maximum_content_stack_bytes,
              checked_helper_interval_bytes=fixture.tool.HELPER_BYTES + 84,
              native_stack_capacity_verified=False, whole_chain_capacity_verified=False,
              runtime_verified=False)), flush=True)
          print('uninstalled=True native_callbacks=modeled runtime_executed=False')
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 17 and not result.skipped else 1)
          PY
      - name: Record evidence limits
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('The fresh content successor reconstructs the pinned fresh field and lease and checks complete typed operands and 28 actual body receipts. It installs no hook, section, provider record or candidate.\n\n')
              output.write('The required seventeen-method source and CPU suite covers all 36 geometries at two synthetic bases, five modeled native content families, value/status/flags/stack observations, bounded arrays and rejection paths. This describes scope, not a pass receipt; all methods must pass without skips. Original-backed RAM reconstruction remains a separate optional private lane.\n\n')
              output.write('Complete fixed/tail/pointer/control and descriptor-shadow checks surround modeled callbacks. Every captured ancestry span excludes the complete RX/RW/modal allocations before its first read. Unknown private-control corruption reaches an unsafe terminal, which proves no healthy native unwind.\n\n')
              output.write('The 784-byte helper and numeric interval [EBP-44, EBP+824) establish no mapped/native or whole-chain capacity. Native callback ABI, receiver/argument validity, provider/RLE lifetime, continuation/primitive/line joins, arena clipping, atomic installation, quit and healthy map return remain unfinished.\n\n')
              output.write('No game, native debugger/compiler, live capture, human input, endurance, release acceptance or stable promotion occurs in this job.\n')
          PY
