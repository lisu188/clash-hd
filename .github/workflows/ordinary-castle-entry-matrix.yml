name: Ordinary castle entry matrix validation
on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/ordinary-castle-entry-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/ordinary-castle-entry-matrix.yml'
permissions:
  contents: read
concurrency:
  group: ordinary-castle-matrix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engine:
    name: Castle matrix actual x86 debugger interpreter
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CLASH_DEBUGGER_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the system Microsoft debugger engine
        shell: pwsh
        run: |
          $engine = Join-Path $env:WINDIR 'SysWOW64\dbgeng.dll'
          if (-not (Test-Path $engine)) { throw 'System x86 debugger engine is required.' }
          $signature = Get-AuthenticodeSignature $engine
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'System debugger engine signature did not verify as Microsoft.'
          }
          Get-Item $engine | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}}
          Get-FileHash $engine -Algorithm SHA256
      - name: Execute the exported commands on marked synthetic PE32 fixtures
        shell: pwsh
        run: |
          $env:CLASH_PROBE_ENGINE_ARTIFACT_DIR = Join-Path $env:RUNNER_TEMP 'castle-matrix-engine-artifacts'
          $env:CLASH_ORDINARY_ENTRY_ENGINE_REPORT = Join-Path $env:RUNNER_TEMP 'castle-matrix-engine-report.json'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x86 tools are required.' }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $entry = Join-Path $env:RUNNER_TEMP 'run-engine-tests.py'
          @'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tools', pattern='test_ordinary_castle_entry_matrix_engine.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and result.testsRun == 5 and not result.skipped else 1)
          '@ | Set-Content -Encoding utf8 $entry
          $batch = Join-Path $env:RUNNER_TEMP 'run-engine-tests.cmd'
          @"
          @echo off
          call "$devcmd" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          python "$entry"
          exit /b %errorlevel%
          "@ | Set-Content -Encoding ascii $batch
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'Debugger-engine integration tests failed.' }
      - name: Require seven terminal retained synthetic receipts
        shell: pwsh
        run: |
          $validation = Join-Path $env:RUNNER_TEMP 'validate-castle-matrix-report.py'
          @'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import test_framed_loaded_probe_engine as engine
          import test_ordinary_castle_entry_matrix_engine as castle
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'castle-matrix-engine-report.json').read_bytes())
          assert report['schema'] == 'clash95_ordinary_entry_matrix_debugger_fixture_v1'
          for field in ('fixture_only', 'completed', 'passed'):
              assert report.get(field) is True, field
          for field in ('game_runtime_executed', 'manual_input_proof', 'native_cleanup_verified', 'promotion_ready', 'retention_debt'):
              assert report.get(field) is False, field
          assert report.get('first_failure') is None and report['compiler']['status'] == 'completed'
          for field, source in {'generator_sha256':'src/patcher/ordinary_castle_entry_matrix.py',
                                'fixture_source_sha256':'tools/test_ordinary_castle_entry_matrix_engine.py',
                                'harness_source_sha256':'tools/test_framed_loaded_probe_engine.py'}.items():
              assert report[field] == hashlib.sha256(Path(source).read_bytes()).hexdigest()
          root = Path(report['artifact_directory']).resolve()
          allowed = (Path(os.environ['RUNNER_TEMP'])/'castle-matrix-engine-artifacts').resolve()
          assert allowed in root.parents
          cases = report['cases']
          assert type(report['expected_cases']) is int and report['expected_cases'] == 7
          assert engine.terminal_cases(cases, castle.EXPECTED)
          for case in cases:
              assert case['passed'] is True and engine.phase_receipt(case['log'])
              assert case['expected_acceptance'] is castle.EXPECTED[case['case']]
              assert case['observed_acceptance'] is case['expected_acceptance']
              if not case['expected_acceptance']:
                  assert case['observed_rejection'] is True
              if case['case'] == 'aslr':
                  assert case['actual_relocation_verified'] is True
              raw_streams = []
              for stream in ('stdout','stderr'):
                  observed = case[stream]
                  assert observed['available'] is True
                  artifact = observed['artifact']; path = Path(artifact['path']).resolve()
                  assert root in path.parents
                  raw = path.read_bytes()
                  assert len(raw) == artifact['bytes'] and hashlib.sha256(raw).hexdigest() == artifact['sha256']
                  raw_streams.append(raw.decode('utf-8','replace'))
              assert ''.join(raw_streams) == case['log']
              for name, field in (('probe-fixture.exe','fixture_sha256'),('verify.cdb','script_sha256')):
                  artifact = case[name]; path = Path(artifact['path']).resolve()
                  assert root in path.parents
                  raw = path.read_bytes()
                  assert len(raw) == artifact['bytes'] and hashlib.sha256(raw).hexdigest() == artifact['sha256'] == case[field]
          print('Seven source-bound retained synthetic castle receipts passed; no game entry proof.')
          '@ | Set-Content -LiteralPath $validation -Encoding utf8
          python -B $validation
          if ($LASTEXITCODE -ne 0) { throw 'Castle synthetic receipt validation failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: castle-matrix-engine-test-report
          path: |
            ${{ runner.temp }}/castle-matrix-engine-report.json
            ${{ runner.temp }}/castle-matrix-engine-artifacts
          retention-days: 7
          if-no-files-found: error

  contracts:
    name: Castle matrix portable and CPU contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the synthetic x86 engine
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Verify portable byte and output contracts
        run: python -B tools/test_ordinary_castle_entry_matrix.py PortableTests -v
      - name: Verify portable retention and castle report rejection
        run: python -B tools/test_probe_engine_retention.py -v
      - name: Verify inherited HD fixture layout and exact parent replay
        run: python -B tools/test_ordinary_castle_entry_matrix_inherited.py PortableTests -v
      - name: Execute exact and matrix admission gates at both load bases
        run: python -B tools/test_ordinary_castle_entry_gate_cpu.py --require-machine-tools -v
