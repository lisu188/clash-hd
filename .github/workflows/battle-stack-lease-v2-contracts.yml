name: Fresh battle stack lease source contracts

on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-stack-lease-v2-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-stack-lease-v2-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-stack-lease-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Fresh stack lease and modeled native returns (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Require all seventeen source and synthetic CPU methods without skips
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          sys.path.insert(0, str(Path('tools').resolve()))
          import test_battle_profile_stack_lease_v2 as fixture
          fixture.field_fixture.routing_fixture.lifetime.prior_fixture.machine_tools()
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.loadTestsFromTestCase(cls)
                                     for cls in (fixture.SourceTests, fixture.CPUTests))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print('uninstalled=True native_callbacks=modeled provider_capacity_verified=False runtime_executed=False')
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 17 and not result.skipped else 1)
          PY
      - name: Record evidence limits
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('The fresh lease re-emits the pinned stack-only template after the canonical field V3. Complete typed operands and actual field/lease post-CALL descriptors are checked. No hook, section, provider record or candidate is installed.\n\n')
              output.write('The required seventeen-method suite includes all 36 profile/preset geometries at two synthetic image bases, both draw modes and seven modeled native families. This summary describes scope, not a pass receipt; success without skipped methods is required separately. The optional original-backed RAM lane is excluded from public CI.\n\n')
              output.write('Full fixed/tail/pointer/control checks and independent descriptor shadows protect cached reads around modeled callbacks. Unknown private return/control corruption reaches an unsafe terminal; this is no healthy unwind or native cancellation proof. Exact virgin denial, owned/history loss and owned off-field denial retain distinct admission evidence.\n\n')
              output.write('The 192-byte lease, 512-byte helper and 1280-byte field frames plus the measured helper numeric interval establish no mapped/native or whole-chain stack capacity. Field V3 does not consume latched lease loss, so next-Tile and intra-Tile cancellation remain unproved. Native callback ABI, receiver/argument validity, provider/RLE lifetime, clipping, continuation/content/primitive/line integration, atomic installation, quit and healthy map return remain unfinished.\n\n')
              output.write('No game, native debugger/compiler, live capture, manual input, endurance, release acceptance or stable promotion occurs in this job.\n')
          PY
