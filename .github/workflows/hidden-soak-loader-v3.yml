name: Joined initial-loader source contracts

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'src/patcher/**'
      - '.github/workflows/hidden-soak-loader-v3.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'src/patcher/**'
      - '.github/workflows/hidden-soak-loader-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidden-soak-loader-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Joined loader portable contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned source fixture dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/requirements-framed-offline.txt
      - name: Verify supplied original grammar and emitted sources without native execution
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/test_hidden_soak_loader_v3.py -v
          python -B tools/test_hidden_soak_loader_v3_engine.py EngineSourceTests -v

  engine:
    name: Joined initial loader on a synthetic x86 process
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CLASH_LOADER_V3_ENGINE_TEST: '1'
      CLASH_LOADER_V3_ENGINE_INTEGRATION: '1'
      _NT_SYMBOL_PATH: '.'
      _NT_ALT_SYMBOL_PATH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require disk reserve before dependencies and native preparation
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import shutil
          import sys
          sys.path.insert(0, str(Path('tools').resolve()))
          import hidden_soak_loader_v3 as source
          usage = shutil.disk_usage(os.environ['RUNNER_TEMP'])
          allowance = source.retention_budget()['fixed_required_peak_bytes']
          print('Native fixture disk preflight:', usage.free, usage.total, allowance)
          if usage.free - allowance <= usage.total // 10:
              raise ValueError('Strict ten-percent reserve plus the bounded pending allowance required')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture reserve is unavailable.' }
      - name: Install pinned public synthetic fixture dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/requirements-framed-offline.txt
      - name: Verify the Microsoft system x86 debugger engine
        shell: pwsh
        run: |
          $enginePath = Join-Path $env:WINDIR 'SysWOW64\dbgeng.dll'
          if (-not (Test-Path -LiteralPath $enginePath)) { throw 'System x86 debugger engine is required.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $enginePath
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'System debugger engine signature did not verify as Microsoft.'
          }
          Get-Item -LiteralPath $enginePath | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}}
          Get-FileHash -LiteralPath $enginePath -Algorithm SHA256
      - name: Capture separate target compiler environments without runner credentials
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'loader-v3-native-artifacts'
          New-Item -ItemType Directory -Path $artifactRoot -ErrorAction Stop | Out-Null
          $env:CLASH_LOADER_V3_ARTIFACT_DIR = $artifactRoot
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CLASH_LOADER_V3_ARTIFACT_DIR=$artifactRoot"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC x64 and x86 tools are required.' }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $snapshotEntry = Join-Path $env:RUNNER_TEMP 'capture-v3-compiler-environment.py'
          @'
          import json
          import os
          from pathlib import Path
          import shutil
          import sys

          arch, output, compiler_output = sys.argv[1:]
          fixed = {'PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'SYSTEMROOT', 'WINDIR', 'TEMP', 'TMP',
                   'COMSPEC', 'PATHEXT', 'SYSTEMDRIVE', 'PROGRAMFILES', 'PROGRAMFILES(X86)',
                   'PROGRAMW6432', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCTOOLSINSTALLDIR',
                   'WINDOWSSDKDIR', 'WINDOWSSDKVERSION', 'WINDOWSSDKBINPATH',
                   'WINDOWSSDKVERBINPATH', 'UNIVERSALCRTSDKDIR', 'UCRTVERSION',
                   'FRAMEWORKDIR', 'FRAMEWORKDIR32', 'FRAMEWORKVERSION', 'FRAMEWORKVERSION32'}
          environment = {key: value for key, value in os.environ.items()
                         if key.upper() in fixed or key.upper().startswith('VSCMD_')}
          if os.environ.get('VSCMD_ARG_TGT_ARCH') != arch:
              raise ValueError('Separate original target architecture environment required')
          if any(os.environ.get(key) for key in ('CL', '_CL_')):
              raise ValueError('Injected compiler switches are forbidden')
          compiler = shutil.which('cl.exe')
          if compiler is None:
              raise ValueError('Target-specific compiler did not resolve')
          Path(output).write_bytes(json.dumps(environment, sort_keys=True, separators=(',', ':'),
                                  ensure_ascii=True, allow_nan=False).encode('ascii'))
          Path(compiler_output).write_text(str(Path(compiler).resolve()), encoding='ascii')
          print('Captured target compiler environment:', arch)
          '@ | Set-Content -LiteralPath $snapshotEntry -Encoding utf8
          foreach ($targetArch in @('x64', 'x86')) {
            $environmentPath = Join-Path $artifactRoot "compiler-environment-$targetArch.json"
            $compilerPathFile = Join-Path $artifactRoot "compiler-path-$targetArch.txt"
            $batch = Join-Path $env:RUNNER_TEMP "capture-v3-compiler-$targetArch.cmd"
            @"
          @echo off
          call "$devcmd" -arch=$targetArch -host_arch=x64
          if errorlevel 1 exit /b 1
          python -B "$snapshotEntry" "$targetArch" "$environmentPath" "$compilerPathFile"
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $batch -Encoding ascii
            & cmd.exe /d /c $batch
            if ($LASTEXITCODE -ne 0) { throw "Compiler environment capture failed: $targetArch" }
            $compilerPath = Get-Content -LiteralPath $compilerPathFile -Raw
            $suffix = $targetArch.ToUpperInvariant()
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "CLASH_V3_CL_$suffix=$compilerPath"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "CLASH_V3_ENV_$suffix=$environmentPath"
          }
      - name: Require one genuine joined native fixture with all eleven cases and no skips
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'run-loader-v3-tests.py'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import unittest

          sys.path.insert(0, str(Path('tools').resolve()))
          import hidden_soak_loader_v3 as source
          suite = unittest.defaultTestLoader.loadTestsFromName('test_hidden_soak_loader_v3_engine.NativeEngineTests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          parent = Path(os.environ['CLASH_LOADER_V3_ARTIFACT_DIR']).resolve()
          reports = list(parent.glob('loader-v3-*/engine-report.json'))
          valid = len(reports) == 1
          if valid:
              report = json.loads(reports[0].read_bytes())
              cases = report.get('cases', [])
              valid = (report.get('schema') == 'synthetic_loader_v3_engine'
                       and report.get('fixture_only') is True
                       and report.get('native_engine_fixture_completed') is True
                       and len(cases) == 11
                       and [case.get('mode') for case in cases] == list(range(11))
                       and all(case.get('completed') is True for case in cases)
                       and all(report.get(key) is False for key in source.FALSE_CLAIMS)
                       and all(report.get('source_hashes', {}).get(name) ==
                               hashlib.sha256((Path('tools') / name).read_bytes()).hexdigest()
                               for name in ('hidden_soak_loader_v3.py', 'hidden_soak_loader_v3_adapter.py',
                                            'test_hidden_soak_loader_v3.py', 'test_hidden_soak_loader_v3_engine.py')))
          sys.exit(0 if result.wasSuccessful() and result.testsRun == 1 and not result.skipped and valid else 1)
          '@ | Set-Content -LiteralPath $entry -Encoding utf8
          python -B $entry
          if ($LASTEXITCODE -ne 0) { throw 'Joined synthetic loader fixture failed or skipped; retain every original.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-joined-loader-v3-fixture
          path: ${{ runner.temp }}/loader-v3-native-artifacts/
          retention-days: 90
          if-no-files-found: error
