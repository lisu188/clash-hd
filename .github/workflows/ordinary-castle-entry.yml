name: Ordinary castle entry source validation

on:
  pull_request:
    paths:
      - 'src/patcher/ordinary_castle_entry.py'
      - 'tools/build_ordinary_castle_entry_candidate.py'
      - 'tools/test_ordinary_castle_entry.py'
      - '.github/workflows/ordinary-castle-entry.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/ordinary_castle_entry.py'
      - 'tools/build_ordinary_castle_entry_candidate.py'
      - 'tools/test_ordinary_castle_entry.py'
      - '.github/workflows/ordinary-castle-entry.yml'

permissions:
  contents: read

jobs:
  source:
    name: Ordinary castle source contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check portable patch, output and fail-closed probe contracts
        run: python tools/test_ordinary_castle_entry.py SourceTests -v
