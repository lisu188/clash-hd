name: Fresh battle field source contracts

on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-field-v3-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-field-v3-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-field-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Fresh field and modeled native tiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Require all nine source and synthetic CPU methods without skips
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          sys.path.insert(0, str(Path('tools').resolve()))
          import test_battle_profile_field_v3 as fixture
          fixture.routing_fixture.lifetime.prior_fixture.machine_tools()
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.loadTestsFromTestCase(cls)
                                     for cls in (fixture.SourceTests, fixture.CPUTests))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print('uninstalled=True native_callbacks=modeled provider_capacity_verified=False runtime_executed=False')
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 9 and not result.skipped else 1)
          PY
      - name: Record evidence limits
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('The versioned field re-emits the pinned terrain template after the canonical fresh routing/lifecycle. Complete typed operands and both exact post-Tile return receipts are checked; no hook, section or candidate is installed.\n\n')
              output.write('The required suite covers all 36 profile/preset geometries at two synthetic image bases with modeled Tile/thread callbacks and independent pixel patterns. This summary describes required scope, not a pass receipt; exact nine-method success without skips is required separately. The original-backed RAM lane is not run in public CI.\n\n')
              output.write('Full fixed/global/pointer/control/tail checks precede the routing ownership callback and cached object reads. The new RW provider reservation stays zero. Query failure keeps FFFFFFFF, exact virgin draw denial keeps zero, and ownership/history/receipt loss keeps two; these establish no interruption inside native Tile or healthy cancellation.\n\n')
              output.write('The 1280-byte field frame and measured component helper extents establish no native or complete-chain capacity. Frozen lease/content/continuation/primitive/line families still require fresh canonical integration, typed branch inventories and actual return descriptors. Provider/RLE lifetime, native clipping, camera/input/animation/dialog/results, quit, atomic installation and runtime acceptance remain unfinished.\n\n')
              output.write('No game, native debugger/compiler, live capture, manual input, endurance, release acceptance or stable promotion occurs in this job.\n')
          PY
