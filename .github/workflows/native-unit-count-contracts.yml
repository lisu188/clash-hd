name: Native Unit Count fixture contracts

on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/native-unit-count-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/native-unit-count-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-unit-count-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authoring:
    name: Native fixture authoring only (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require four frozen prefix authoring methods
        run: python -B tools/test_battle_profile_native_adjacent_prefix_original.py
      - name: Require five Unit Count authoring methods
        run: python -B tools/test_battle_profile_native_unit_count_original.py
      - name: Check the public boundary
        run: python -B tools/check-public-boundary.py

  atomic-model:
    name: Uninstalled atomic dependency models (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Require all thirteen source and synthetic methods without skips
        run: python -B tools/test_battle_profile_adjacent_unit_v2.py

# Both native fixtures use their default authoring-only mode here. Public CI
# supplies no original executable and never invokes --original-backed, a game,
# debugger, capture, installed candidate or visible/manual runtime.
