name: Modal-widget HD runtime

on:
  pull_request:
    paths:
      - tools/real_exe_smoke.py
      - tools/test_real_exe_smoke.py
      - tools/modal_widgets_context.py
      - tools/test_modal_widgets_context.py
      - .github/workflows/widget-runtime.yml
  workflow_dispatch:
    inputs:
      execute:
        description: 'Launch the experimental modal-widget EXE on an isolated Windows runner'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: widget-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r tools/requirements-framed-offline.txt
      - name: Test selection and source binding without launching a game
        run: python tools/test_real_exe_smoke.py
      - name: Authenticate widget contexts with synthetic bundles
        run: python tools/test_modal_widgets_context.py

  runtime:
    if: github.repository == 'lisu188/clash-hd' && github.event_name == 'workflow_dispatch' && inputs.execute
    needs: source
    strategy:
      fail-fast: false
      matrix:
        resolution: ['1024x768', '1920x1080']
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RUN_ROOT: C:/ClashTests/widget-runtime-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.resolution }}
      PROXY_ROOT: C:/ClashTests/widget-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lisu188/clash-assets
          ref: 84a1e4bcf131e6bb75b39fc5e10941dd0b801767
          path: assets
          persist-credentials: false
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Materialize pinned original runtime
        shell: bash
        working-directory: assets
        run: git lfs pull --include='runtime/gog-32003/**' --exclude=''
      - name: Build source-bound diagnostic proxy
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r code/tools/requirements-framed-offline.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          & ./code/scripts/build/build_ddraw_surfdump_proxy.ps1 -OutputDll "$env:PROXY_ROOT/ddraw.dll" -LogDir "$env:PROXY_ROOT"
      - name: Build and run the actual modal-widget candidate
        shell: pwsh
        run: |
          python code/tools/real_exe_smoke.py --execute --runtime assets/runtime/gog-32003 --manifest assets/sources/gog-32003/manifest.json --out "$env:RUN_ROOT" --proxy "$env:PROXY_ROOT/ddraw.dll" --seconds 60 --complete-hd --hd-recipe modalwidgets --hd-resolution '${{ matrix.resolution }}' --hd-only
          exit $LASTEXITCODE
      - name: Retain exact source and runtime identities
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUN_ROOT") {
            Copy-Item code/tools/real_exe_smoke.py "$env:RUN_ROOT/runtime-source.py"
            Copy-Item code/tools/test_real_exe_smoke.py "$env:RUN_ROOT/runtime-tests.py"
            git -C code rev-parse HEAD | Set-Content "$env:RUN_ROOT/source-commit.txt"
          }
      - name: Retain observations but not EXE, DLL or resource archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modal-widget-runtime-${{ matrix.resolution }}
          path: |
            ${{ env.RUN_ROOT }}/summary.json
            ${{ env.RUN_ROOT }}/compile.log
            ${{ env.RUN_ROOT }}/real-exe-engine.cpp
            ${{ env.RUN_ROOT }}/runtime-source.py
            ${{ env.RUN_ROOT }}/runtime-tests.py
            ${{ env.RUN_ROOT }}/source-commit.txt
            ${{ env.RUN_ROOT }}/modalwidgets-proxy/
            ${{ env.RUN_ROOT }}/bundle/*.candidate.json
            ${{ env.PROXY_ROOT }}/ddraw_surfdump_proxy.build.json
          if-no-files-found: warn
          retention-days: 7
