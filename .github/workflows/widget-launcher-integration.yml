name: Isolated widget launcher integration
on:
  push:
    branches: [codex/widget-launcher]
    paths:
      - tools/prepare_widget_launcher_commit.py
      - tools/widget_launcher_integration.json
      - .github/workflows/widget-launcher-integration.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'lisu188/clash-hd'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated UI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk
          python -m pip install --only-binary=:all: -r tools/requirements-framed-offline.txt
      - name: Apply reviewed exact-source changes and test before publishing task branch
        env:
          CLASH_LAUNCHER_UI_TESTS: '1'
        run: xvfb-run -a -s '-screen 0 2400x1800x24 -nolisten tcp' python tools/prepare_widget_launcher_commit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: widget-launcher-review
          path: ${{ runner.temp }}/widget-launcher-review/
          if-no-files-found: warn
          retention-days: 7
