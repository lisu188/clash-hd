name: Battle primitive request source contracts

on:
  pull_request:
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-primitive-request-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'src/patcher/**'
      - 'tools/**'
      - '.github/workflows/battle-primitive-request-contracts.yml'

permissions:
  contents: read

concurrency:
  group: battle-primitive-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Uninstalled primitive requests and continuation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned synthetic CPU interpreter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: unicorn==2.1.4
      - name: Check all preset request and continuation contracts without skips
        run: python -B tools/test_battle_profile_primitive_request.py --require-machine-tools
      - name: Record evidence limits
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('Thirteen primitive requests and seventy-four baseline adapters are modeled across all 36 profile/preset geometries at two bases.\n\n')
              output.write('Requests preserve native register/stack arguments and distinguish malformed, empty and prepared arena intersections. No sprite objects are dereferenced by the request layer.\n\n')
              output.write('All hooks remain absent. Native primitive replay, provider ownership, pixel writes, immediate cancellation, healthy restoration, runtime, input, endurance, release and promotion remain unproved.\n')
          PY
